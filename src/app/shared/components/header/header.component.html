<header class="site-header">
  <div class="container header-row">
    <a class="brand" routerLink="/" (click)="close()">
      @if (logo()) {
        <img class="brand-logo" [src]="logo()" [alt]="siteName()" />
      } @else {
        <app-logo-mark />
      }
      <span class="brand-name">{{ siteName() }}</span>
    </a>

    <nav class="nav" [class.open]="menuOpen()" aria-label="Основная навигация">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.path === '/' }"
          (click)="close()"
        >
          {{ item.label }}
        </a>
      }
      <a class="nav-contact" routerLink="/contact" routerLinkActive="active" (click)="close()">Контакты</a>
    </nav>

    <div class="header-actions">
      <a class="btn btn-primary header-cta" routerLink="/contact">Обсудить проект</a>
      <button
        class="theme-toggle"
        type="button"
        [attr.aria-label]="theme() === 'dark' ? 'Включить светлую тему' : 'Включить тёмную тему'"
        (click)="toggleTheme()"
      >
        @if (theme() === 'dark') {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
        }
      </button>
      <button
        class="burger"
        type="button"
        [attr.aria-expanded]="menuOpen()"
        aria-label="Открыть меню"
        (click)="toggle()"
      >
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>
